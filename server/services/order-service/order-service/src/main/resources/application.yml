spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  redis:
    host: localhost
    port: 6379

  application:
    name: order-service
# this is what OrderService @Value("${products.base-url:...}") reads
products:
  base-url: http://localhost:8080
jwt:
  secret: 08788b9566dad0f379f4530d090c9163cc199fdf76eef8443bee827d05bee706fff39966
  expiration: 3600000

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry:  true
    register-with-eureka: true

  instance:
    prefer-ip-address: true

logging:
  level:
    org:
      springframework:
        security=DEBUG:

